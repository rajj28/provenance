# Production-shaped stack: web, worker, migrations, postgres, redis.
#
# Unlike docker-compose.yml (local dev services only), nothing here publishes a
# database or cache port to the host — Postgres and Redis are reachable only on
# the internal network. Put a TLS-terminating reverse proxy in front of `web`.
#
# Required in .env.production: POSTGRES_PASSWORD, AUTH_SECRET,
# APP_ENCRYPTION_KEY, CRON_SECRET, APP_URL.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Runs once per deploy, before web and worker start.
  migrate:
    build:
      context: .
      target: runner
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
      REDIS_URL: redis://redis:6379
    # Give worker.ts time to drain in-flight syncs on SIGTERM.
    stop_grace_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  redisdata:
